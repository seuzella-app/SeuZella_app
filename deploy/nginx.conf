# ============================================================================
# SEU ZÉLLA — Nginx Reverse Proxy Config
# ============================================================================
# Setup:
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/seuzella
#   2. sudo ln -s /etc/nginx/sites-available/seuzella /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#   5. sudo certbot --nginx -d seuzella.com.br -d www.seuzella.com.br
# ============================================================================

upstream seuzella_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name seuzella.com.br www.seuzella.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seuzella.com.br www.seuzella.com.br;

    # SSL (preenchido automaticamente pelo certbot)
    # ssl_certificate /etc/letsencrypt/live/seuzella.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seuzella.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header X-Security-Shield "zero-trust-v4" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    location /sounds/ {
        alias /var/www/seuzella/public/sounds/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "https://seuzella.com.br";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        alias /var/www/seuzella/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        alias /var/www/seuzella/public/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/javascript; charset=utf-8";
    }

    location = /offline.html {
        alias /var/www/seuzella/public/offline.html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        alias /var/www/seuzella/public/manifest.webmanifest;
        expires 1h;
        add_header Content-Type "application/manifest+json";
    }

    location /_next/static/ {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/(api/webhooks|api/checkout/webhook) {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        limit_req zone=webhooks burst=20 nodelay;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location /mobile/ {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        expires 5m;
    }

    location / {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

# Rate limit zones must be declared inside the main nginx.conf http {} block:
# limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
