# ============================================================================
# SEU ZÉLLA — Nginx Reverse Proxy Config
# ============================================================================
# Setup:
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/seuzella
#   2. sudo ln -s /etc/nginx/sites-available/seuzella /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#   5. sudo certbot --nginx -d seuzella.com.br -d www.seuzella.com.br
# ============================================================================

# ─── Upstream (Next.js standalone running on port 3000) ─────────────────────
upstream seuzella_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name seuzella.com.br www.seuzella.com.br;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seuzella.com.br www.seuzella.com.br;

    # SSL (preenchido automaticamente pelo certbot)
    # ssl_certificate /etc/letsencrypt/live/seuzella.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seuzella.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header X-Security-Shield "zero-trust-v3" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Body size limit ────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ─── Static assets (sounds, images, sw.js) — cache longo ───────────────
    location /sounds/ {
        alias /var/www/seuzella/public/sounds/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "https://seuzella.com.br";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        alias /var/www/seuzella/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker — NÃO cachear (precisa atualizar imediatamente)
    location = /sw.js {
        alias /var/www/seuzella/public/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/javascript; charset=utf-8";
    }

    location = /offline.html {
        alias /var/www/seuzella/public/offline.html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        alias /var/www/seuzella/public/manifest.webmanifest;
        expires 1h;
        add_header Content-Type "application/manifest+json";
    }

    # ─── Next.js static chunks ──────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ─── API routes — sem cache ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (para live-feed SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (crons podem demorar até 60s)
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffering off para SSE
        proxy_buffering off;
        proxy_cache off;

        # CORS para webhooks (restrito)
        add_header Access-Control-Allow-Origin "https://seuzella.com.br" always;
    }

    # ─── Webhooks — rate limitado ──────────────────────────────────────────
    location ~ ^/(api/webhooks|api/checkout/webhook) {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limit (10 req/s por IP)
        limit_req zone=webhooks burst=20 nodelay;

        # Timeouts curtos (webhooks precisam responder rápido)
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ─── Mobile routes — prerendered ────────────────────────────────────────
    location /mobile/ {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 5m;
    }

    # ─── Main app ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://seuzella_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ─── Brotli (se instalado) ─────────────────────────────────────────────
    # brotli on;
    # brotli_comp_level 4;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ─── Health check endpoint ──────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ─── Rate limit zones (declarar no http {} do nginx.conf principal) ─────────
# Adicione ao /etc/nginx/nginx.conf dentro do bloco http {}:
#
# limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
