name: CI - Suite 1: SAST & Static Security Analysis

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/sast-static.test.ts'
      - '.github/workflows/ci-sast.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sast-analysis:
    name: Run SAST & Security Header Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Execute SAST Vitest Suite
        run: npx vitest run tests/sast-static.test.ts
