name: CI - Cérebro Zélla: Multi-Turn Long Drift Memory Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/cerebro/**'
      - 'tests/zella-multi-turn-drift.test.ts'
      - '.github/workflows/ci-zella-multi-turn-drift.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  multi-turn-drift-test:
    name: Run Multi-Turn Memory & Long Context Drift Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Multi-Turn Drift Vitest Suite
        run: npx vitest run tests/zella-multi-turn-drift.test.ts
