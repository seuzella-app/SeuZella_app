# Targeted MetaGPT/AutoGen certification.
# Master Gate remains the only mandatory PR/push gate.

name: 🤖 Multi-Agent System Certification

on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-agent-certification
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci

jobs:
  certification:
    name: 🧠 MetaGPT + AutoGen Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: MetaGPT tests
        run: npx vitest run tests/unit-metagpt-engine.test.ts --reporter=dot
      - name: AutoGen tests
        run: npx vitest run tests/unit-autogen-engine.test.ts --reporter=dot
      - name: Business logic tests
        run: npx vitest run tests/unit-business-logic.test.ts --reporter=dot
