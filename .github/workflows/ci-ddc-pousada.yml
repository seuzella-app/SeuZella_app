name: CI - DDC Pousadas Dashboard

on:
  push:
    paths:
      - 'src/app/ddc/pousada/**'
      - '.github/workflows/ci-ddc-pousada.yml'
  pull_request:
    paths:
      - 'src/app/ddc/pousada/**'

jobs:
  validate-ddc-pousada:
    name: Validate DDC Pousadas Component & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck DDC Pousada Module
        run: npx tsc --noEmit

      - name: Verify Next.js Build
        run: npm run build
