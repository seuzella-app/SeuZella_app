# ============================================================================
# RETIRED — legacy fast gate kept for manual diagnostics only.
# The mandatory PR/main gate is .github/workflows/master-gate.yml.
# This workflow intentionally has no push/pull_request trigger to avoid running
# a second checkout/install/test pipeline in parallel with the Master Gate.
# ============================================================================

name: 🧰 Legacy Master CI — Manual Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-master-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
  CI: 'true'

jobs:
  diagnostic:
    name: 🧰 Legacy Fast Gate Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: ESLint Audit
        run: npm run lint -- --max-warnings=0

      - name: Unit and Security Regression Suite
        run: |
          npx vitest run \
            tests/unit-business-logic.test.ts \
            tests/sast-static.test.ts \
            tests/data-governance-lgpd.test.ts \
            tests/ai-prompt-eval-lgpd.test.ts \
            tests/pwa-mobile-manifest.test.ts \
            tests/zcc-security.test.ts \
            tests/security-hardening-12-fronts.test.ts

      - name: Dependency Audit
        run: npm audit --audit-level=high

      - name: Prisma Schema Validation
        run: npx prisma validate
