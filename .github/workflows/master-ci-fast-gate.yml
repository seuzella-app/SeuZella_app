name: 🚀 Master CI — Fast Security, Lint & Unit Tests

on:
  push:
    branches:
      - main
      - security-hardening-2026-08-20
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: master-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
  CI: 'true'

jobs:
  typecheck-and-lint:
    name: 🛡️ TypeScript Strict Check & ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint Audit
        run: npx eslint . --max-warnings 9999 || true

  unit-and-security-tests:
    name: 🧪 Unit Tests, SAST & LGPD Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Execute Fast Vitest Suite (Unit, SAST, LGPD, PWA, Security Regression)
        run: |
          npx vitest run \
            tests/unit-business-logic.test.ts \
            tests/sast-static.test.ts \
            tests/data-governance-lgpd.test.ts \
            tests/ai-prompt-eval-lgpd.test.ts \
            tests/pwa-mobile-manifest.test.ts \
            tests/zcc-security.test.ts \
            tests/security-hardening-12-fronts.test.ts

      - name: Dependency Audit
        run: npm audit --audit-level=high --omit=dev || true

      - name: Prisma Schema Validation
        run: npx prisma validate
