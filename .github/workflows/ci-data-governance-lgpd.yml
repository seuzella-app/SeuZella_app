name: CI - Iceberg Block 3: Data Governance, Secrets & LGPD

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/security/**'
      - 'src/lib/lgpd/**'
      - 'tests/data-governance-lgpd.test.ts'
      - '.github/workflows/ci-data-governance-lgpd.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  data-governance-lgpd-test:
    name: Run Data Governance, Secrets Encryption & LGPD Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Data Governance & LGPD Vitest Suite
        run: npx vitest run tests/data-governance-lgpd.test.ts
