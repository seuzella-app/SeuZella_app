name: CI - Cérebro Zélla: Multi-Tenant Cross-Talk Audit

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/cerebro/**'
      - 'tests/zella-cross-talk.test.ts'
      - '.github/workflows/ci-zella-cross-talk.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-talk-test:
    name: Run Multi-Tenant Cross-Talk Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Cross-Talk Vitest Suite
        run: npx vitest run tests/zella-cross-talk.test.ts
