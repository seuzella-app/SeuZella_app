name: Repository Cleanup (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'remove vendored design corpus') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove vendored design corpus
        run: |
          set -euo pipefail
          TARGET='.agents/skills/awesome-design-md'
          if [ -d "$TARGET" ]; then
            rm -rf "$TARGET"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A "$TARGET"
            git commit -m 'chore(cleanup): remove vendored design corpus'
            git push origin main
          else
            echo 'Target already absent; nothing to clean.'
          fi
