# Heavy stress/security suite — intentionally NOT part of per-PR CI.
# The lightweight blocking security checks live in master-gate.yml.
# Run this suite manually when a change affects locks, concurrency,
# payments, webhooks or infrastructure, or promote it to scheduled CI later.

name: Stress & Security Deep Suite (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Heavy suite manual-only
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Heavy stress/security workflow is manual-only by design."
          echo "Master Gate remains the authoritative PR/main gate."
