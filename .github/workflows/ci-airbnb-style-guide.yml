# Retired from automatic CI.
# Airbnb-specific lint is already covered by Master Gate.
# Keep this workflow for targeted manual diagnostics only.

name: 🏠 Airbnb Style Guide Lint (Manual Diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airbnb-lint-manual
  cancel-in-progress: true

jobs:
  lint:
    name: 🏠 Airbnb ESLint Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run Airbnb-targeted lint
        run: |
          npx eslint src/lib/airb/ src/lib/airb-pro/ \
            src/components/ddc/ZellaAirBTab.tsx \
            src/components/ddc/airb-pro/ \
            src/components/mobile/MobileAirbnbSuperApp.tsx \
            src/components/zcc/panels/airbnb-panel.tsx \
            src/lib/strategies/ZellaAirBStrategy.ts \
            --max-warnings 0
