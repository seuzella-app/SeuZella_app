name: production-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zehla_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/zehla_ci
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run tests/mobile tests/security tests/locks tests/brain tests/sast-static.test.ts tests/data-governance-lgpd.test.ts tests/ai-prompt-eval-lgpd.test.ts tests/pwa-mobile-manifest.test.ts tests/zcc-security.test.ts
      - run: npm run build
