# ============================================================================
# 🚦 MASTER GATE — Pipeline Determinístico GO/NO-GO
# ============================================================================
# ÚNICO gate obrigatório para PRs/merges.
# GitHub Actions executa apenas a validação determinística e barata.
# Stress/E2E/deep scans ficam em janelas próprias (ou serão movidos para VPS).
# ============================================================================

name: 🚦 Master Gate — GO/NO-GO

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'vercel.json'
      - '.github/workflows/master-gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'vercel.json'
      - '.github/workflows/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

concurrency:
  group: master-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'

jobs:
  # --------------------------------------------------------------------------
  # FAST GATE — somente PR/push/manual; nunca duplica o nightly.
  # --------------------------------------------------------------------------
  fast-gate:
    name: ⚡ Fast Gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (lockfile)
        run: npm ci --legacy-peer-deps

      - name: TypeScript Type Check
        id: typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: ESLint
        id: lint
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Unit Tests (targeted)
        id: unit
        run: npm run test:unit -- --reporter=dot --timeout=30000
        continue-on-error: true

      - name: Secret Scan (fail closed)
        id: secrets
        shell: bash
        run: |
          set -o pipefail
          if grep -rEn \
            '(sk_live_[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,}|github_pat_[a-zA-Z0-9_]{20,}|AKIA[A-Z0-9]{16}|-----BEGIN[[:space:]]+.*PRIVATE KEY-----)' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git \
            --exclude='*.test.*' --exclude='*.spec.*' --exclude='.env.example' \
            src/ .github/ 2>/dev/null; then
            echo '::error::Potential hard-coded secret detected.'
            exit 1
          fi
          echo 'No matching hard-coded secrets detected.'

      - name: Fast Gate Verdict
        id: result
        shell: bash
        run: |
          TYPECHECK='${{ steps.typecheck.outcome }}'
          LINT='${{ steps.lint.outcome }}'
          UNIT='${{ steps.unit.outcome }}'
          SECRETS='${{ steps.secrets.outcome }}'
          echo "TS:${TYPECHECK} | Lint:${LINT} | Unit:${UNIT} | Secrets:${SECRETS}"
          if [[ "$TYPECHECK" == success && "$LINT" == success && "$UNIT" == success && "$SECRETS" == success ]]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
            echo '::notice::✅ Fast Gate PASSED'
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
            echo '::error::❌ Fast Gate FAILED'
            exit 1
          fi

  # --------------------------------------------------------------------------
  # FULL SUITE — somente depois do Fast Gate.
  # --------------------------------------------------------------------------
  full-suite:
    name: 🔬 Full Suite
    needs: fast-gate
    if: github.event_name != 'schedule' && needs.fast-gate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (lockfile)
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Next.js Build
        id: build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
        continue-on-error: true

      - name: Security Certification Suite
        id: security
        run: npx vitest run tests/security/ --reporter=dot --timeout=30000
        continue-on-error: true

      - name: Prisma Schema Validation
        id: prisma
        run: npx prisma validate
        continue-on-error: true

      - name: Full Suite Verdict
        id: result
        shell: bash
        run: |
          BUILD='${{ steps.build.outcome }}'
          SECURITY='${{ steps.security.outcome }}'
          PRISMA='${{ steps.prisma.outcome }}'
          echo "Build:${BUILD} | Security:${SECURITY} | Prisma:${PRISMA}"
          if [[ "$BUILD" == success && "$SECURITY" == success && "$PRISMA" == success ]]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
            echo '::notice::✅ Full Suite PASSED'
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
            echo '::error::❌ Full Suite FAILED'
            exit 1
          fi

  # --------------------------------------------------------------------------
  # NIGHTLY — somente deep security. Não repete Fast/Full.
  # --------------------------------------------------------------------------
  nightly-deep-scan:
    name: 🌙 Nightly Deep Security
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (lockfile)
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deep Security Scan
        run: |
          npx tsx -e "import { runFullSecurityScan } from './src/lib/security/security-scan-service'; runFullSecurityScan().then(r => { console.log(JSON.stringify({ total:r.totalFound, critical:r.criticalCount, high:r.highCount, mode:r.mode })); process.exit(r.criticalCount > 0 ? 1 : 0); }).catch(e => { console.error(e); process.exit(1); });"

      - name: Dependency Audit
        run: npm audit --audit-level=high --omit=dev

  # --------------------------------------------------------------------------
  # VERDICT — apenas PR/push/manual; schedule não cria falso NO-GO.
  # --------------------------------------------------------------------------
  verdict:
    name: 🏁 GO / NO-GO
    needs: [fast-gate, full-suite]
    if: github.event_name != 'schedule' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit Verdict
        shell: bash
        run: |
          FAST='${{ needs.fast-gate.outputs.passed }}'
          FULL='${{ needs.full-suite.outputs.passed }}'
          echo "Fast Gate: $FAST"
          echo "Full Suite: $FULL"
          if [[ "$FAST" == true && "$FULL" == true ]]; then
            echo '::notice::✅ GO — All mandatory gates passed.'
          else
            echo '::error::❌ NO-GO — Mandatory gate failed.'
            exit 1
          fi

      - name: Comment PR with verdict
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fast = '${{ needs.fast-gate.outputs.passed }}' === 'true';
            const full = '${{ needs.full-suite.outputs.passed }}' === 'true';
            const go = fast && full;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `## ${go ? '✅' : '❌'} Master Gate: ${go ? 'GO' : 'NO-GO'}\n\n| Gate | Status |\n|---|---|\n| Fast Gate | ${fast ? '✅' : '❌'} |\n| Full Suite | ${full ? '✅' : '❌'} |\n\n${go ? '**Safe to merge.**' : '**DO NOT MERGE.**'}`,
            });
