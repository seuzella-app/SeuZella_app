# ============================================================================
# 🚦 MASTER GATE — Pipeline Determinístico GO/NO-GO
# ============================================================================
# ÚNICO gate obrigatório para PRs/merges.
# PR/push executam UMA instalação/checkout e uma sequência determinística.
# Deep scans/noturnos vivem em workflow separado e nunca poluem o gate.
# ============================================================================

name: 🚦 Master Gate — GO/NO-GO

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx/**'
      - 'infra/**'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'next.config.*'
      - 'vercel.json'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - 'middleware.*'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'nginx/**'
      - 'infra/**'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'next.config.*'
      - 'vercel.json'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - 'middleware.*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

concurrency:
  group: master-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'

jobs:
  quality-gate:
    name: ⚡ Quality Gate — GO/NO-GO
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (lockfile)
        run: npm ci --legacy-peer-deps

      # ========================== FAST GATE ================================
      - name: TypeScript Type Check
        id: typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: ESLint
        id: lint
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Unit Tests (targeted)
        id: unit
        run: npm run test:unit -- --reporter=dot --timeout=30000
        continue-on-error: true

      - name: Secret Scan (fail closed)
        id: secrets
        shell: bash
        run: |
          set -o pipefail
          if grep -rEn \
            '(sk_live_[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,}|github_pat_[a-zA-Z0-9_]{20,}|AKIA[A-Z0-9]{16}|-----BEGIN[[:space:]]+.*PRIVATE KEY-----)' \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git \
            --exclude='*.test.*' --exclude='*.spec.*' --exclude='.env.example' \
            src/ .github/ 2>/dev/null; then
            echo '::error::Potential hard-coded secret detected.'
            exit 1
          fi
          echo 'No matching hard-coded secrets detected.'

      - name: Fast Gate Verdict
        id: fast-verdict
        shell: bash
        run: |
          TYPECHECK='${{ steps.typecheck.outcome }}'
          LINT='${{ steps.lint.outcome }}'
          UNIT='${{ steps.unit.outcome }}'
          SECRETS='${{ steps.secrets.outcome }}'
          echo "TS:${TYPECHECK} | Lint:${LINT} | Unit:${UNIT} | Secrets:${SECRETS}"
          if [[ "$TYPECHECK" == success && "$LINT" == success && "$UNIT" == success && "$SECRETS" == success ]]; then
            echo '::notice::✅ Fast Gate PASSED — advancing to Full Suite.'
          else
            echo '::error::❌ Fast Gate FAILED — Full Suite blocked.'
            exit 1
          fi

      # ========================== FULL SUITE ================================
      - name: Generate Prisma Client
        if: success()
        run: npx prisma generate

      - name: Next.js Build
        id: build
        if: success()
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
        continue-on-error: true

      - name: Security Certification Suite
        id: security
        if: steps.build.outcome == 'success'
        run: npx vitest run tests/security/ --reporter=dot --timeout=30000
        continue-on-error: true

      - name: Prisma Schema Validation
        id: prisma
        if: steps.build.outcome == 'success' && steps.security.outcome == 'success'
        run: npx prisma validate
        continue-on-error: true

      - name: Full Suite Verdict
        id: full-verdict
        if: always()
        shell: bash
        run: |
          BUILD='${{ steps.build.outcome }}'
          SECURITY='${{ steps.security.outcome }}'
          PRISMA='${{ steps.prisma.outcome }}'
          echo "Build:${BUILD} | Security:${SECURITY} | Prisma:${PRISMA}"
          if [[ "$BUILD" == success && "$SECURITY" == success && "$PRISMA" == success ]]; then
            echo '::notice::✅ Full Suite PASSED.'
          else
            echo '::error::❌ Full Suite FAILED.'
            exit 1
          fi

      # ========================== FINAL VERDICT =============================
      - name: 🏁 GO / NO-GO
        if: always()
        shell: bash
        run: |
          FAST='${{ steps.fast-verdict.outcome }}'
          FULL='${{ steps.full-verdict.outcome }}'
          echo "Fast Gate: $FAST"
          echo "Full Suite: $FULL"
          if [[ "$FAST" == success && "$FULL" == success ]]; then
            echo '::notice::✅ GO — All mandatory gates passed.'
          else
            echo '::error::❌ NO-GO — Mandatory gate failed. DO NOT MERGE.'
            exit 1
          fi

      - name: Comment PR with verdict
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fast = '${{ steps.fast-verdict.outcome }}' === 'success';
            const full = '${{ steps.full-verdict.outcome }}' === 'success';
            const go = fast && full;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `## ${go ? '✅' : '❌'} Master Gate: ${go ? 'GO' : 'NO-GO'}\n\n| Gate | Status |\n|---|---|\n| Fast Gate | ${fast ? '✅' : '❌'} |\n| Full Suite | ${full ? '✅' : '❌'} |\n\n${go ? '**Safe to merge.**' : '**DO NOT MERGE.**'}`,
            });
