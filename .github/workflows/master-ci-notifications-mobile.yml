name: 🔔 Master CI — Notifications & Mobile Suite

# ============================================================================
# Tests everything related to the Zélla Mobile Notification System
# Validates: producer, bridges, catalog, achievement engine, plan limits
# ============================================================================

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/notifications/**'
      - 'src/components/ddc/notifications/**'
      - 'src/components/ddc/conquistas/**'
      - 'src/app/api/ddc/notifications/**'
      - 'src/app/api/v1/guest/ddc/notifications/**'
      - 'src/app/api/cron/**'
      - 'src/app/api/webhooks/**'
      - 'src/__tests__/notifications/**'
      - 'src/__tests__/mobile/**'
      - 'src/__tests__/crons/**'
      - 'src/__tests__/webhooks/**'
      - 'src/__tests__/pwa/**'
      - 'src/__tests__/components/**'
      - 'src/__tests__/integration/**'
      - 'src/__tests__/e2e/**'
      - 'vitest.config.ts'
      - 'package.json'
      - '.github/workflows/master-ci-notifications-mobile.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/notifications/**'
      - 'src/components/ddc/notifications/**'
      - 'src/components/ddc/conquistas/**'
      - 'src/app/api/ddc/notifications/**'
      - 'src/app/api/cron/**'
      - 'src/app/api/webhooks/**'
      - 'src/__tests__/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: TypeScript type checking for notifications + mobile
  # ──────────────────────────────────────────────────────────────────────────
  typecheck-notifications:
    name: 🔍 TypeScript Check (Notifications)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit
        env:
          CI: 'true'

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests for producer, catalog, achievement engine
  # ──────────────────────────────────────────────────────────────────────────
  unit-notifications:
    name: 🧪 Unit Tests (Producer + Catalog + Achievement Engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Notification Unit Tests
        run: |
          npx vitest run \
            src/__tests__/notifications/producer.test.ts \
            src/__tests__/notifications/catalog.test.ts \
            src/__tests__/mobile/notifications.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Bridge tests (13 bridges + 12 wiring validation)
  # ──────────────────────────────────────────────────────────────────────────
  bridges-tests:
    name: 🌉 Bridge Tests (13 Bridges + Wiring)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Bridge Tests
        run: npx vitest run src/__tests__/notifications/bridges.test.ts

      - name: Run Bridge Wiring Validation Tests
        run: npx vitest run src/__tests__/integration/bridge-wiring.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Plan limits checker tests
  # ──────────────────────────────────────────────────────────────────────────
  plan-limits-tests:
    name: 📊 Plan Limits Checker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Plan Limits Checker Tests
        run: npx vitest run src/__tests__/notifications/plan-limits-checker.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: ConquistasTab UI tests (PARCEIRO_ZÉLLA only)
  # ──────────────────────────────────────────────────────────────────────────
  conquistas-tab-tests:
    name: 🏆 Conquistas Tab UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Conquistas Tab Tests
        run: npx vitest run src/__tests__/components/conquistas-tab.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: PWA + Sounds tests (Gap 6 + Gap 11)
  # ──────────────────────────────────────────────────────────────────────────
  pwa-sounds-tests:
    name: 📱 PWA v2 + Sounds Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run PWA + Sounds Tests
        run: npx vitest run src/__tests__/pwa/sounds-and-sw.test.ts

      - name: Verify Sound Files Exist
        run: |
          echo "=== Sound files in public/sounds/ ==="
          ls -la public/sounds/
          test -f public/sounds/alert.mp3 || (echo "❌ alert.mp3 missing" && exit 1)
          test -f public/sounds/notification.mp3 || (echo "❌ notification.mp3 missing" && exit 1)
          test -f public/sounds/success.mp3 || (echo "❌ success.mp3 missing" && exit 1)
          test -f public/sounds/info.mp3 || (echo "❌ info.mp3 missing" && exit 1)
          echo "✅ All 4 sound files present"

      - name: Verify PWA Service Worker v2
        run: |
          echo "=== PWA Service Worker version check ==="
          if grep -q "seuzella-pwa-v2" public/sw.js; then
            echo "✅ SW bumped to v2"
          else
            echo "❌ SW not on v2"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: E2E regression suite
  # ──────────────────────────────────────────────────────────────────────────
  e2e-regression:
    name: 🔬 E2E Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run E2E Regression Suite
        run: npx vitest run src/__tests__/e2e/regression-e2e.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Job 8: Summary gate — fails if any previous job failed
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: ✅ Notifications Mobile Suite Summary
    runs-on: ubuntu-latest
    needs:
      - typecheck-notifications
      - unit-notifications
      - bridges-tests
      - plan-limits-tests
      - conquistas-tab-tests
      - pwa-sounds-tests
      - e2e-regression
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check Job Results
        if: ${{ needs.typecheck-notifications.result != 'success' || needs.unit-notifications.result != 'success' || needs.bridges-tests.result != 'success' || needs.plan-limits-tests.result != 'success' || needs.conquistas-tab-tests.result != 'success' || needs.pwa-sounds-tests.result != 'success' || needs.e2e-regression.result != 'success' }}
        run: |
          echo "❌ One or more jobs failed"
          echo "  typecheck-notifications: ${{ needs.typecheck-notifications.result }}"
          echo "  unit-notifications: ${{ needs.unit-notifications.result }}"
          echo "  bridges-tests: ${{ needs.bridges-tests.result }}"
          echo "  plan-limits-tests: ${{ needs.plan-limits-tests.result }}"
          echo "  conquistas-tab-tests: ${{ needs.conquistas-tab-tests.result }}"
          echo "  pwa-sounds-tests: ${{ needs.pwa-sounds-tests.result }}"
          echo "  e2e-regression: ${{ needs.e2e-regression.result }}"
          exit 1

      - name: All Tests Passed
        run: |
          echo "✅ All Notifications Mobile tests passed!"
          echo "  - TypeScript check ✅"
          echo "  - Unit tests (producer, catalog, achievement engine) ✅"
          echo "  - Bridge tests (13 bridges + wiring) ✅"
          echo "  - Plan limits checker tests ✅"
          echo "  - Conquistas Tab UI tests ✅"
          echo "  - PWA v2 + Sounds tests ✅"
          echo "  - E2E regression suite ✅"
