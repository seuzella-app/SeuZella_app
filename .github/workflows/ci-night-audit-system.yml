# Night Audit certification is diagnostic/deep work, not a PR gate.
# Master Gate owns mandatory PR/push validation.

name: 🌙 Night Audit System Certification

on:
  schedule:
    - cron: '30 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-audit-certification
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'

jobs:
  test:
    name: 🧪 Night Audit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Night Audit certification
        run: npx vitest run tests/night-audit-system.test.ts --reporter=dot
