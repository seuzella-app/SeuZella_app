# Extended security certification.
# Master Gate is the blocking merge gate; this suite is intentionally scheduled.

name: 🔒 V11-P0 — Security Certification

on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-security-certification
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
  CI: 'true'

jobs:
  security-certification:
    name: 🔒 Extended ZCC/M2M Security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Security certification suite
        run: |
          npx vitest run \
            tests/zcc-security.test.ts \
            tests/sast-static.test.ts \
            tests/data-governance-lgpd.test.ts \
            --reporter=dot
