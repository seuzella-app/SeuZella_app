# ============================================================
# V11-P0 CI — Security Suite (M2M Auth + Shield Libraries)
# ============================================================
# Validates the security hotfix delivered in V11-P0:
#   - M2M EdDSA (Ed25519) auth for 3 cron routes (Gap #3)
#   - Token issuance endpoint /api/auth/m2m/token (RFC 6749)
#   - withSecurity HOF enforcement on 5 ZCC routes (Gap R5)
#   - 4-scanner chain (PII / injection / topics / audit)
#
# Triggers:
#   - On push to main touching security paths
#   - On PRs to main
#   - Manual via GitHub Actions UI / Google Antigravity
# ============================================================

name: V11-P0 — Security Suite

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/security/**'
      - 'src/app/api/auth/m2m/**'
      - 'src/app/api/cron/**'
      - 'src/app/api/zcc/**'
      - 'tests/security/**'
      - 'prisma/schema.prisma'
      - '.github/workflows/ci-v11-p0-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/security/**'
      - 'src/app/api/auth/m2m/**'
      - 'src/app/api/cron/**'
      - 'src/app/api/zcc/**'
      - 'tests/security/**'
  workflow_dispatch: # Google Antigravity manual trigger

permissions:
  contents: read

concurrency:
  group: v11-p0-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m2m-auth-tests:
    name: M2M EdDSA Auth (Cron + Token Issuance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-v11-secret-0123456789abcdef0123456789abcdef"
      NODE_ENV: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize Dev DB (SQLite)
        run: npx prisma db push --skip-generate

      - name: TypeScript Typecheck (security lib)
        run: npx tsc --noEmit

      - name: Run Cron Auth Test Suite (13 cases)
        run: npx vitest run tests/security/cron-auth.test.ts --reporter=verbose

  zcc-shield-audit:
    name: ZCC withSecurity Wrapping Audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-v11-secret-0123456789abcdef0123456789abcdef"
      NODE_ENV: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Audit withSecurity Coverage (5 ZCC routes)
        run: |
          echo "==> Audit: 5 ZCC routes must use withSecurity({ auth: 'zcc-admin' })"
          ROUTES=(
            "src/app/api/zcc/cerebro/analyses/route.ts"
            "src/app/api/zcc/cerebro/anomalies/route.ts"
            "src/app/api/zcc/cerebro/refactors/route.ts"
            "src/app/api/zcc/cerebro/test-alert/route.ts"
            "src/app/api/zcc/cerebro/stream/route.ts"
          )
          MISSING=0
          for route in "${ROUTES[@]}"; do
            if [[ ! -f "$route" ]]; then
              echo "  MISSING file: $route"
              MISSING=$((MISSING+1))
              continue
            fi
            if ! grep -q "withSecurity" "$route"; then
              echo "  FAIL: $route — withSecurity not found"
              MISSING=$((MISSING+1))
            else
              echo "  OK:   $route"
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            echo ""
            echo "FAIL: $MISSING route(s) missing withSecurity wrapping"
            exit 1
          fi
          echo ""
          echo "All 5 ZCC routes properly wrapped."

  cron-route-auth-audit:
    name: Cron Routes Auth Audit (M2M)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Audit M2M auth on 3 cron routes
        run: |
          echo "==> Audit: 3 cron routes must use verifyCronM2MToken"
          ROUTES=(
            "src/app/api/cron/cerebro-analyze/route.ts"
            "src/app/api/cron/cerebro-budget-forecast/route.ts"
            "src/app/api/cron/weekly-report/route.ts"
          )
          MISSING=0
          for route in "${ROUTES[@]}"; do
            if [[ ! -f "$route" ]]; then
              echo "  MISSING file: $route"
              MISSING=$((MISSING+1))
              continue
            fi
            if grep -q "CRON_SECRET" "$route" && ! grep -q "verifyCronM2MToken" "$route"; then
              echo "  FAIL: $route — still uses legacy CRON_SECRET without M2M"
              MISSING=$((MISSING+1))
            elif ! grep -q "verifyCronM2MToken" "$route"; then
              echo "  FAIL: $route — verifyCronM2MToken not found"
              MISSING=$((MISSING+1))
            else
              echo "  OK:   $route"
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            echo ""
            echo "FAIL: $MISSING route(s) missing M2M auth"
            exit 1
          fi
          echo ""
          echo "All 3 cron routes properly wrapped with M2M EdDSA auth."

  security-summary:
    name: V11-P0 Security Summary
    runs-on: ubuntu-latest
    needs: [m2m-auth-tests, zcc-shield-audit, cron-route-auth-audit]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Aggregate Results
        run: |
          echo "==================== V11-P0 Security Summary ===================="
          echo "M2M Auth Tests:        ${{ needs.m2m-auth-tests.result }}"
          echo "ZCC Shield Audit:      ${{ needs.zcc-shield-audit.result }}"
          echo "Cron Auth Audit:       ${{ needs.cron-route-auth-audit.result }}"
          echo "================================================================="
          if [[ "${{ needs.m2m-auth-tests.result }}" != "success" || \
                "${{ needs.zcc-shield-audit.result }}" != "success" || \
                "${{ needs.cron-route-auth-audit.result }}" != "success" ]]; then
            echo "FAILED — one or more security checks did not pass"
            exit 1
          fi
          echo "ALL V11-P0 SECURITY CHECKS PASSED"
