name: CI - Cérebro Zélla & ZCC Core

on:
  push:
    paths:
      - 'src/lib/cerebro/**'
      - 'src/app/api/zcc/**'
      - '.github/workflows/ci-cerebro.yml'
  pull_request:
    paths:
      - 'src/lib/cerebro/**'
      - 'src/app/api/zcc/**'

permissions:
  contents: read

jobs:
  validate-cerebro:
    name: Validate Cérebro Zélla Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck Cérebro Engine
        run: npx tsc --noEmit

      - name: Verify Build
        run: npm run build
