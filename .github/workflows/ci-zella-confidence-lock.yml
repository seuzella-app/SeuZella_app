name: CI - Cérebro Zélla: Confidence Lock & Human Handover Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/cerebro/**'
      - 'tests/zella-confidence-lock.test.ts'
      - '.github/workflows/ci-zella-confidence-lock.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  confidence-lock-test:
    name: Run Confidence Lock (< 0.90) & Handover Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Confidence Lock Vitest Suite
        run: npx vitest run tests/zella-confidence-lock.test.ts
