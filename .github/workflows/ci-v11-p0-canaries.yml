name: 🐦 V11-P0 — RLS Canaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
  CI: 'true'

jobs:
  rls-canaries-sqlite:
    name: 🐦 RLS Multi-Tenant Canaries (SQLite 16 Testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Execute Multi-Tenant RLS & Cross-Talk Canaries
        run: |
          npx vitest run \
            tests/zella-cross-talk.test.ts \
            tests/locks-multi-tenant-scale.test.ts \
            tests/integration-db-cache.test.ts
