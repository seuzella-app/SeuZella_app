name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Master Gate is the authoritative pre-merge quality gate.
# This workflow is intentionally deployment-only: it must not duplicate
# checkout, npm ci, typecheck, lint, security or production-readiness checks.
permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}

jobs:
  deploy:
    name: Deploy via SSH na VPS
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify VPS configuration
        if: ${{ env.VPS_HOST == '' }}
        run: |
          echo "VPS_HOST is not configured; deployment is intentionally blocked."
          echo "Master Gate remains authoritative for code quality; configure VPS secrets to enable deployment."
          exit 0

      - name: Disparo de Deploy Remoto na VPS
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: zehla
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/zehla
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml build --no-cache app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy
            docker system prune -f
