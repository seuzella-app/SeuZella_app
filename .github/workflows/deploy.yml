name: Production Deployment

on:
  # Deploy only after the authoritative Master Gate completes successfully on main.
  # This prevents deployment from racing ahead of a failed post-merge gate.
  workflow_run:
    workflows: ["🚦 Master Gate — GO/NO-GO"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Deployment is intentionally separate from validation. Master Gate owns
# code-quality/security readiness; this workflow only performs the VPS rollout.
permissions:
  contents: read

concurrency:
  group: production-deploy-main
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}

jobs:
  deploy:
    name: Deploy via SSH na VPS
    # Manual dispatch remains available for recovery. Automatic deployment
    # requires the Master Gate to have completed successfully on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify VPS configuration
        if: ${{ env.VPS_HOST == '' }}
        run: |
          echo "VPS_HOST is not configured; deployment is intentionally blocked."
          echo "Master Gate remains authoritative for code quality; configure VPS secrets to enable deployment."
          exit 0

      - name: Disparo de Deploy Remoto na VPS
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: zehla
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/zehla
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml build --no-cache app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy
            docker system prune -f
