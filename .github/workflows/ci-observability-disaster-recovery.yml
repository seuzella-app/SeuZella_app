name: CI - Iceberg Block 2: Observability, Alerts & Disaster Recovery

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/cerebro/**'
      - 'src/app/api/health/**'
      - 'tests/observability-disaster-recovery.test.ts'
      - '.github/workflows/ci-observability-disaster-recovery.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  observability-recovery-test:
    name: Run Observability, Alerts & Disaster Recovery Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Observability & Disaster Recovery Vitest Suite
        run: npx vitest run tests/observability-disaster-recovery.test.ts
