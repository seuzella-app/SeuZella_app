# ZéCode PR Review — Workflow de CI/CD
#
# Acionado em todo PR aberto/sincronizado/reaberto.
# Chama a API do ZCC para análise automatizada de código.
#
# SEGURANÇA:
#  - GITHUB_TOKEN nativo (escopos limitados: contents:read, pull-requests:write)
#  - NUNCA usa PAT do Vault
#  - ZE_CODE_WEBHOOK_TOKEN é secret do repositório
#  - PR metadata é transportado via env/jq, nunca interpolado em shell
#  - Skip automático em PRs criados pelo próprio ZéCode
#  - Timeout de 10 min (falha graciosa — não bloqueia merge)
#  - Diff > 500KB ou >10000 linhas é pulado

name: ZéCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  ze-code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if ZéCode-automated PR (skip to avoid loop)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json author --jq '.author.login')
          echo "PR author: $PR_AUTHOR"

          if [[ "$PR_AUTHOR" == "ze-code-bot[bot]" ]] || \
             [[ "$PR_AUTHOR" == "ze-code-bot" ]] || \
             [[ "$PR_AUTHOR" == *"ze-code-automated"* ]] || \
             [[ "$PR_AUTHOR" == *"[bot]"* && "$PR_AUTHOR" == *"ze-code"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ZéCode-automated PR detected, skipping review to avoid loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR diff size
        if: steps.check.outputs.skip != 'true'
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff "origin/${BASE_REF}...HEAD" > /tmp/pr.diff
          SIZE=$(wc -c < /tmp/pr.diff)
          LINES=$(wc -l < /tmp/pr.diff)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "Diff size: $SIZE bytes ($LINES lines)"

      - name: Skip if too large (>500KB)
        if: |
          steps.check.outputs.skip != 'true' &&
          steps.diff.outputs.size > 500000
        run: echo "::warning::Diff too large (${{ steps.diff.outputs.size }} bytes), skipping ZéCode review"

      - name: Skip if too many lines (>10000)
        if: |
          steps.check.outputs.skip != 'true' &&
          steps.diff.outputs.size <= 500000 &&
          steps.diff.outputs.lines > 10000
        run: echo "::warning::Diff too many lines (${{ steps.diff.outputs.lines }}), skipping ZéCode review"

      - name: Call ZéCode API
        if: |
          steps.check.outputs.skip != 'true' &&
          steps.diff.outputs.size <= 500000 &&
          steps.diff.outputs.lines <= 10000
        id: review
        env:
          ZE_CODE_API_URL: ${{ secrets.ZE_CODE_API_URL }}
          ZE_CODE_WEBHOOK_TOKEN: ${{ secrets.ZE_CODE_WEBHOOK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DIFF_URL: ${{ github.event.pull_request.diff_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "$ZE_CODE_API_URL" ]; then
            echo "::notice::Secret ZE_CODE_API_URL não configurado, skipping external webhook review"
            exit 0
          fi
          if [ -z "$ZE_CODE_WEBHOOK_TOKEN" ]; then
            echo "::notice::Secret ZE_CODE_WEBHOOK_TOKEN não configurado, skipping external webhook review"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg repository "$REPOSITORY" \
            --argjson prNumber "$PR_NUMBER" \
            --arg headSha "$HEAD_SHA" \
            --arg baseRef "$BASE_REF" \
            --arg headRef "$HEAD_REF" \
            --arg diffUrl "$DIFF_URL" \
            --arg author "$AUTHOR" \
            --arg title "$TITLE" \
            '{repository:$repository,prNumber:$prNumber,headSha:$headSha,baseRef:$baseRef,headRef:$headRef,diffUrl:$diffUrl,author:$author,title:$title}')

          RESPONSE=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $ZE_CODE_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$ZE_CODE_API_URL/api/zcc/ze-code/github-review")

          REVIEW_ID=$(echo "$RESPONSE" | jq -r '.reviewId // empty')
          if [ -z "$REVIEW_ID" ]; then
            echo "::notice::External ZéCode review skipped: response contained no reviewId"
            exit 0
          fi

          echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::ZéCode review started: $REVIEW_ID"

      - name: Poll for review completion
        if: steps.review.outputs.review_id
        env:
          ZE_CODE_API_URL: ${{ secrets.ZE_CODE_API_URL }}
          ZE_CODE_WEBHOOK_TOKEN: ${{ secrets.ZE_CODE_WEBHOOK_TOKEN }}
          REVIEW_ID: ${{ steps.review.outputs.review_id }}
        run: |
          set -euo pipefail
          MAX_POLLS=30
          POLL_INTERVAL=10

          for i in $(seq 1 $MAX_POLLS); do
            STATUS=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $ZE_CODE_WEBHOOK_TOKEN" \
              "$ZE_CODE_API_URL/api/zcc/ze-code/reviews/$REVIEW_ID/status" \
              | jq -r '.status // "unknown"')

            echo "Poll $i/$MAX_POLLS: status=$STATUS"
            if [ "$STATUS" = "completed" ]; then
              echo "Review completed!"
              exit 0
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "::error::ZéCode review failed"
              exit 1
            fi
            sleep "$POLL_INTERVAL"
          done

          echo "::warning::ZéCode review timed out after 5 minutes"
          exit 0

      - name: Post review as PR comment
        if: steps.review.outputs.review_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZE_CODE_API_URL: ${{ secrets.ZE_CODE_API_URL }}
          ZE_CODE_WEBHOOK_TOKEN: ${{ secrets.ZE_CODE_WEBHOOK_TOKEN }}
          REVIEW_ID: ${{ steps.review.outputs.review_id }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          RESULT=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $ZE_CODE_WEBHOOK_TOKEN" \
            "$ZE_CODE_API_URL/api/zcc/ze-code/reviews/$REVIEW_ID")
          COMMENT_BODY=$(echo "$RESULT" | jq -r '.formattedComment // .summary // empty')

          if [ -z "$COMMENT_BODY" ]; then
            echo "::warning::Review sem comment formatado, skipando post"
            exit 0
          fi

          EXISTING_COMMENT_ID=$(gh api \
            "/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" or (.body | contains("ZéCode Automated Review")))][0].id // empty')

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "/repos/$REPOSITORY/issues/comments/$EXISTING_COMMENT_ID" \
              -f body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$COMMENT_BODY"
          fi
