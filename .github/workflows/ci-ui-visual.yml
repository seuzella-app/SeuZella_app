name: CI - Suite 7: UI & Visual Playwright Headless Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/**'
      - 'src/app/**'
      - 'tests/ui-visual-playwright.test.ts'
      - '.github/workflows/ci-ui-visual.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-visual-test:
    name: Run Headless UI & Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute UI Visual Vitest Suite
        run: npx vitest run tests/ui-visual-playwright.test.ts
