name: apply-pricing-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pricing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lib/payments/pricing.ts')
          s = p.read_text()
          s = s.replace("parceiro: { pix: 247, cartao: 247, boleto: 257 },", "parceiro: { pix: 297, cartao: 297, boleto: 307 },", 1)
          p.write_text(s)

          p = Path('src/components/landing/PricingSection.tsx')
          s = p.read_text()
          pairs = [
            ("pricePix: 247,\n    priceCartao: 247,\n    priceLabel: 'R$247',", "pricePix: 297,\n    priceCartao: 297,\n    priceLabel: 'R$297',"),
            ("desc: 'Plano PRO completo por R$247/mês — preço congelado por 24 meses", "desc: 'Plano PRO completo por R$297/mês — preço congelado por 24 meses"),
            ("idealParaPousada: '1–5 pousadas',", "idealParaPousada: 'até 12 quartos',"),
            ("idealParaPousada: '1–2 pousadas',", "idealParaPousada: '1–5 quartos',"),
            ("idealParaPousada: '3–5 pousadas',", "idealParaPousada: 'até 12 quartos',"),
            ("idealParaPousada: '6+ pousadas',", "idealParaPousada: 'até 20 quartos',"),
            ("{ text: 'Plano PRO completo — R$247/mês', included: true },", "{ text: 'Plano PRO completo — R$297/mês', included: true },"),
            ("{ text: 'Economia de R$150/mês vs. PRO regular', included: true },", "{ text: 'Economia de R$100/mês vs. PRO regular', included: true },"),
          ]
          for a, b in pairs:
              s = s.replace(a, b, 1)
          marker = "        </AnimatePresence>\n\n        {/* Pousada Upsell & Faturamento Transparente */}"
          block = '''        </AnimatePresence>\n\n        {/* Pacote exclusivo para pousadas acima de 20 quartos */}\n        {isPousada && (\n          <motion.div initial={{ opacity: 0, y: 20 }} animate={isInView ? { opacity: 1, y: 0 } : {}} transition={{ duration: 0.6, delay: 0.45 }} className="max-w-4xl mx-auto mb-16 mt-4">\n            <div className="rounded-2xl border border-amber-500/25 bg-gradient-to-b from-amber-950/20 via-zinc-900/90 to-zinc-950/95 p-6 sm:p-8 shadow-2xl">\n              <p className="text-amber-400 text-xs font-bold uppercase tracking-wider">PACOTE EXCLUSIVO</p>\n              <h4 className="text-white font-extrabold text-lg sm:text-xl mt-1">Acima de 20 quartos</h4>\n              <p className="text-neutral-300 text-sm leading-relaxed mt-4">Para pousadas com <strong className="text-white">mais de 20 quartos</strong>, o pacote passa para o <strong className="text-amber-300">MAX</strong>, mantendo todas as funções do plano, com adicional de <strong className="text-amber-300">R$47,00 por quarto</strong> acima do limite de 20 quartos.</p>\n            </div>\n          </motion.div>\n        )}\n\n        {/* Pousada Upsell & Faturamento Transparente */}'''
          if marker not in s:
              raise SystemExit('Pricing insertion marker not found')
          s = s.replace(marker, block, 1)
          p.write_text(s)

          p = Path('src/app/parceiro/page.tsx')
          s = p.read_text()
          s = s.replace('Preço Fundador R$ 247/mês', 'Preço Fundador R$ 297/mês', 1)
          s = s.replace('R$ 247/mês congelado por 24 meses', 'R$ 297/mês congelado por 24 meses', 1)
          s = s.replace('R$ 247,00/mês por 24 meses', 'R$ 297,00/mês por 24 meses', 1)
          p.write_text(s)
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          l = Path('src/components/landing/PricingSection.tsx').read_text()
          p = Path('src/lib/payments/pricing.ts').read_text()
          assert "idealParaPousada: '1–5 quartos'" in l
          assert "idealParaPousada: 'até 12 quartos'" in l
          assert "idealParaPousada: 'até 20 quartos'" in l
          assert 'Acima de 20 quartos' in l
          assert 'R$47,00 por quarto' in l
          assert "parceiro: { pix: 297, cartao: 297, boleto: 307 }" in p
          assert not any(x in l for x in ('1–5 pousadas','1–2 pousadas','3–5 pousadas','6+ pousadas'))
          print('PASS: canonical pricing correction applied')
          PY

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/PricingSection.tsx src/lib/payments/pricing.ts src/app/parceiro/page.tsx PRICING_CORRECTION_TRIGGER.md
          git commit -m "fix(pricing): correct room tiers and MAX overage" || true
          git rm -f .github/workflows/apply-pricing-fix.yml .github/workflows/one-time-pricing-correction.yml PRICING_CORRECTION_TRIGGER.md || true
          git commit -m "chore(ci): remove temporary pricing fix workflows" || true
          git push
