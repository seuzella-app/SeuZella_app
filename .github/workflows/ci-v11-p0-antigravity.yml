# V11-P0 full orchestrator is a heavy certification harness.
# It MUST NOT run on every push/PR. Master Gate owns merge validation.
# Use manually before major releases or when validating the complete stack.

name: 🎯 V11-P0 — Google Antigravity Orchestrator (Manual)

on:
  workflow_dispatch:
    inputs:
      run_canaries_pg:
        description: 'Run PostgreSQL canaries'
        required: false
        type: boolean
        default: true
      run_build:
        description: 'Run build smoke test'
        required: false
        type: boolean
        default: true
      fail_fast:
        description: 'Stop on first error'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: v11-antigravity-manual
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
  CI: 'true'

jobs:
  certification:
    name: 🎯 V11-P0 Full Certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Security audit
        run: npx vitest run tests/zcc-security.test.ts tests/sast-static.test.ts tests/data-governance-lgpd.test.ts --reporter=dot
      - name: RLS and cross-tenant canaries
        run: npx vitest run tests/zella-cross-talk.test.ts tests/locks-multi-tenant-scale.test.ts tests/integration-db-cache.test.ts --reporter=dot
      - name: Harness and integration
        run: npx vitest run tests/dspy-optimizer.test.ts tests/dpo-collector.test.ts --reporter=dot
      - name: Build smoke test
        if: ${{ inputs.run_build }}
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
      - name: Digital Twin suite
        run: npx vitest run tests/zcc-digital-twin/ --reporter=dot
      - name: Concurrency stress
        run: npx vitest run tests/stress-avalanche-k6.test.ts tests/high-stress-concurrency.test.ts --reporter=dot
