# Targeted Smart Locks integration certification.
# Deliberately removed from every PR/push to avoid duplicating Master Gate.
# Runs weekly and on demand; lock changes remain covered by Master Gate security tests.

name: 🔐 Locks Integration Certification

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locks-integration-certification
  cancel-in-progress: true

jobs:
  test:
    name: 🔐 Locks lifecycle integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Locks Certification
        run: npx vitest run tests/locks-integration.test.ts --reporter=dot
