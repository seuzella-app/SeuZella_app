# Deep Codex security certification.
# Mandatory PR security remains in Master Gate; this workflow is scheduled/manual.

name: 🔒 Codex Security Certification

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codex-security-certification
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run deep security scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ../security-reports
          npx codex-security scan . \
            --output-dir ../security-reports \
            --mode deep \
            --max-time-hours 2
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ../security-reports/sarif.sarif
