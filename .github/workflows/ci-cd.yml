# ============================================================================
# Zélla — CI/CD Pipeline
# ============================================================================
# Roda a cada push/PR em main:
#   1. TypeCheck (tsc --noEmit)
#   2. ESLint (Airbnb rules)
#   3. Vitest (testes unitários + integração)
#   4. Build (next build)
#   5. Security scan (npm audit + secrets detection)
#   6. Prisma validate
# ============================================================================

name: Zélla CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: TypeCheck + Lint
  # ───────────────────────────────────────────────────────────────────────────
  typecheck-lint:
    name: TypeCheck + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeCheck
        run: npx tsc --noEmit
        continue-on-error: false

      - name: ESLint
        run: npx eslint src/ --max-warnings=50
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Testes unitários e de integração
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Testes (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npx vitest run tests/unit-business-logic.test.ts tests/unit-metagpt-engine.test.ts tests/unit-autogen-engine.test.ts tests/zecode-git-applier.test.ts tests/smart-locks.test.ts tests/pwa-mobile-manifest.test.ts
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
          NODE_ENV: 'test'
          NEXTAUTH_SECRET: 'test-secret-for-ci'
          BYPASS_MIDDLEWARE_AUTH: 'true'

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Build (Next.js)
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npx next build
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
          NEXTAUTH_SECRET: 'build-secret-for-ci'
          SKIP_ENV_VALIDATION: 'true'
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: Security scan
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: typecheck-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: npm audit (high+critical)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Run SAST Security Test
        run: npx vitest run tests/sast-static.test.ts
        continue-on-error: false

      - name: Validate Prisma schema
        run: npx prisma validate
        continue-on-error: false
