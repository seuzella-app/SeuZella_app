# ============================================================================
# Zélla — CI/CD Pipeline
# ============================================================================
# Push/PR gate: deterministic install, typecheck, lint, tests, build,
# dependency security and Prisma validation. A failed gate must fail CI.
# ============================================================================

name: Zélla CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'

jobs:
  typecheck-lint:
    name: TypeCheck + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: TypeCheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src/ --max-warnings=0

  test:
    name: Testes (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck-lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run tests
        run: npx vitest run tests/unit-business-logic.test.ts tests/unit-metagpt-engine.test.ts tests/unit-autogen-engine.test.ts tests/zecode-git-applier.test.ts tests/smart-locks.test.ts tests/pwa-mobile-manifest.test.ts
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
          NODE_ENV: 'test'
          NEXTAUTH_SECRET: 'test-secret-for-ci'

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build Next.js
        run: npx next build
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
          NEXTAUTH_SECRET: 'build-secret-for-ci'
          SKIP_ENV_VALIDATION: 'true'

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: typecheck-lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high+critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Run SAST Security Test
        run: npx vitest run tests/sast-static.test.ts
      - name: Validate Prisma schema
        run: npx prisma validate
