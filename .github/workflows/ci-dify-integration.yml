# Targeted Dify/Cérebro integration certification.
# Master Gate is the authoritative PR/push gate; this suite is scheduled/manual.

name: 🧠 Dify Integration Certification

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dify-integration-certification
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'

jobs:
  test:
    name: 🧠 Dify Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Dify integration certification
        run: npx vitest run tests/dify-integration.test.ts --reporter=dot
