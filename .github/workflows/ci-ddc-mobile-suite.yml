# Targeted DDC/mobile diagnostic.
# Automatic typecheck/lint/unit validation belongs to Master Gate.
# Run manually when changing DDC/mobile surfaces.

name: 📱 DDC Mobile & Web Suite (Manual Diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddc-mobile-manual
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
  CI: 'true'

jobs:
  ddc-suite:
    name: 📱 DDC Mobile/Web targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Typecheck DDC baseline
        run: npx tsc --noEmit
      - name: DDC mobile suite
        run: npx vitest run tests/mobile-ddc-suite.test.tsx
      - name: DDC regression tests
        run: npx vitest run tests/unit-business-logic.test.ts tests/pwa-mobile-manifest.test.ts
