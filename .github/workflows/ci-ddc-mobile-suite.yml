name: 📱 DDC Mobile & Web Suite — CI/CD Quality & Health Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
  CI: 'true'

jobs:
  typecheck-and-lint:
    name: 🛡️ TypeScript Strict & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Type Check (tsc --noEmit)
        run: npx tsc --noEmit

  mobile-and-web-suite-tests:
    name: 🧪 Mobile & Web DDC Suite Vitest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run DDC Mobile Suite Tests
        run: npx vitest run tests/mobile-ddc-suite.test.tsx

      - name: Run Unit & Business Logic Test Suite
        run: npx vitest run tests/unit-business-logic.test.ts tests/pwa-mobile-manifest.test.ts
