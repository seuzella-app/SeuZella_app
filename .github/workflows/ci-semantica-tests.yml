# Semantica/GraphRAG certification suite.
# Master Gate owns PR/push validation; this heavier integration suite is scheduled/manual.

name: 🧠 Semantica Integration Certification

on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/seuzella_test'
  USE_SEMANTICA_GRAPH: 'false'
  SEMANTICA_BASE_URL: http://127.0.0.1:9999
  SEMANTICA_API_KEY: ''
  SEMANTICA_TIMEOUT_MS: '3000'
  SEMANTICA_CACHE_TTL: '300'
  SEMANTICA_MAX_RETRIES: '3'

concurrency:
  group: semantica-certification
  cancel-in-progress: true

jobs:
  certification:
    name: 🧠 Semantica Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Semantica client tests
        run: npx vitest run tests/semantica-client.test.ts --reporter=dot
      - name: GraphRAG tests
        run: npx vitest run tests/semantica-graph-rag.test.ts --reporter=dot
      - name: LGPD tests
        run: npx vitest run tests/semantica-lgpd.test.ts --reporter=dot
      - name: Integration contracts
        run: |
          test -f src/lib/semantica/types.ts
          test -f src/lib/semantica/client.ts
          test -f src/app/api/zcc/semantica/graph/route.ts
          test -f src/app/api/zcc/semantica/decisions/route.ts
          test -f src/app/api/lgpd/forget-guest/route.ts
          test -f ontology/zella.ttl
          grep -q 'owl:Ontology' ontology/zella.ttl
          grep -q 'sh:NodeShape' ontology/zella.ttl
