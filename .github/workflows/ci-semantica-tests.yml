# ============================================================================
# ZÉLLA — CI: Semantica Integration Tests
# ============================================================================
# Roda os testes de integração do Semantica (GraphRAG + Decision Intelligence)
# após cada push para main ou pull request.
#
# Testes cobertos:
#   - SemanticaClient (types, cache, fallback, retry, auth)
#   - GraphRAG thin wrapper (addNode, addEdge, hybridSearch)
#   - LGPD forget-guest (validação, anonimização, compliance)
#   - APIs /api/zcc/semantica/* (graph, decisions, conflicts, export)
#
# Resultados:
#   - Sucesso: ✅ verde (não bloqueia merge)
#   - Falha: ❌ vermelho (bloqueia merge até correção)
# ============================================================================

name: 🧠 Semantica Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/semantica/**'
      - 'src/lib/ml/graph-rag.ts'
      - 'src/lib/ai/cognitive-router.ts'
      - 'src/lib/brain/conversation-learner.ts'
      - 'src/lib/cerebro/knowledge-distiller.ts'
      - 'src/app/api/zcc/semantica/**'
      - 'src/app/api/lgpd/**'
      - 'tests/semantica-*.test.ts'
      - '.github/workflows/ci-semantica-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/semantica/**'
      - 'src/lib/ml/graph-rag.ts'
      - 'src/lib/ai/cognitive-router.ts'
      - 'src/lib/brain/conversation-learner.ts'
      - 'src/lib/cerebro/knowledge-distiller.ts'
      - 'src/app/api/zcc/semantica/**'
      - 'src/app/api/lgpd/**'
      - 'tests/semantica-*.test.ts'

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
  USE_SEMANTICA_GRAPH: 'false'
  SEMANTICA_BASE_URL: http://127.0.0.1:9999
  SEMANTICA_API_KEY: ''
  SEMANTICA_TIMEOUT_MS: '3000'
  SEMANTICA_CACHE_TTL: '300'
  SEMANTICA_MAX_RETRIES: '3'

jobs:
  semantica-unit-tests:
    name: 🧪 Semantica Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"

      - name: Run Semantica Client Tests
        run: npx vitest run tests/semantica-client.test.ts --reporter=verbose
        env:
          USE_SEMANTICA_GRAPH: 'false'

      - name: Run GraphRAG Tests
        run: npx vitest run tests/semantica-graph-rag.test.ts --reporter=verbose

      - name: Run LGPD Tests
        run: npx vitest run tests/semantica-lgpd.test.ts --reporter=verbose

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: semantica-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  semantica-integration-check:
    name: 🔗 Integration Imports Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"

      - name: Verify semantica/types.ts exports
        run: |
          node -e "
          const types = require('./src/lib/semantica/types.ts');
          console.log('Types module loaded');
          " || echo "TypeScript module — checking via tsc"

      - name: Verify semantica/client.ts exports
        run: |
          npx tsc --noEmit src/lib/semantica/client.ts src/lib/semantica/types.ts 2>&1 | head -20 || true

      - name: Verify graph-rag.ts imports semantica
        run: |
          grep -q "SemanticaClient" src/lib/ml/graph-rag.ts && echo "✅ graph-rag imports SemanticaClient" || exit 1
          grep -q "withFallback" src/lib/semantica/client.ts && echo "✅ client exports withFallback" || exit 1

      - name: Verify cognitive-router imports graph-rag
        run: |
          grep -q "hybridGraphSearch" src/lib/ai/cognitive-router.ts && echo "✅ cognitive-router calls hybridGraphSearch" || exit 1
          grep -q "recordDecisionAsync" src/lib/ai/cognitive-router.ts && echo "✅ cognitive-router calls recordDecisionAsync" || exit 1

      - name: Verify conversation-learner imports semantica
        run: |
          grep -q "SemanticaClient" src/lib/brain/conversation-learner.ts && echo "✅ conversation-learner imports SemanticaClient" || exit 1
          grep -q "syncPatternToGraphRAG" src/lib/brain/conversation-learner.ts && echo "✅ conversation-learner has syncPatternToGraphRAG" || exit 1

      - name: Verify knowledge-distiller imports semantica
        run: |
          grep -q "SemanticaClient" src/lib/cerebro/knowledge-distiller.ts && echo "✅ knowledge-distiller imports SemanticaClient" || exit 1
          grep -q "syncDistilledPatternToGraph" src/lib/cerebro/knowledge-distiller.ts && echo "✅ knowledge-distiller has syncDistilledPatternToGraph" || exit 1

      - name: Verify API routes exist
        run: |
          test -f src/app/api/zcc/semantica/graph/route.ts && echo "✅ graph API exists" || exit 1
          test -f src/app/api/zcc/semantica/decisions/route.ts && echo "✅ decisions API exists" || exit 1
          test -f src/app/api/zcc/semantica/conflicts/route.ts && echo "✅ conflicts API exists" || exit 1
          test -f src/app/api/zcc/semantica/ingest/route.ts && echo "✅ ingest API exists" || exit 1
          test -f src/app/api/zcc/semantica/export/route.ts && echo "✅ export API exists" || exit 1
          test -f src/app/api/lgpd/forget-guest/route.ts && echo "✅ LGPD forget-guest API exists" || exit 1

      - name: Verify ontology file exists
        run: |
          test -f ontology/zella.ttl && echo "✅ Ontology OWL/Turtle exists" || exit 1
          grep -q "owl:Ontology" ontology/zella.ttl && echo "✅ Valid OWL ontology" || exit 1
          grep -q "sh:NodeShape" ontology/zella.ttl && echo "✅ SHACL constraints present" || exit 1

      - name: Verify Docker Compose for dev
        run: |
          test -f docker-compose.semantica.yml && echo "✅ Docker Compose exists" || exit 1
          grep -q "semantica-sidecar" docker-compose.semantica.yml && echo "✅ Sidecar service defined" || exit 1
          grep -q "postgres-semantica" docker-compose.semantica.yml && echo "✅ Postgres service defined" || exit 1

      - name: Verify env vars documented
        run: |
          grep -q "USE_SEMANTICA_GRAPH" .env.example && echo "✅ USE_SEMANTICA_GRAPH documented" || exit 1
          grep -q "SEMANTICA_API_KEY" .env.example && echo "✅ SEMANTICA_API_KEY documented" || exit 1
          grep -q "SEMANTICA_BASE_URL" .env.example && echo "✅ SEMANTICA_BASE_URL documented" || exit 1

  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [semantica-unit-tests, semantica-integration-check]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"

      - name: Build Next.js
        run: npx next build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
          NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: production
          USE_SEMANTICA_GRAPH: 'false'

      - name: Verify build output
        run: |
          test -d .next/standalone && echo "✅ Standalone build created" || exit 1
          echo "Build completed successfully"
