name: ⏰ Master CI — Crons & Webhooks

# Specialized certification lane. The mandatory PR/main gate is master-gate.yml.
# Keep this suite scheduled/manual so cron coverage is not duplicated on every merge.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-webhook-certification
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  NEXTAUTH_URL: http://localhost:3000
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
  CRON_SECRET: test-cron-secret-for-ci
  BOOKING_COM_WEBHOOK_SECRET: test-booking-secret-12345678901234567890

jobs:
  cron-and-webhook-certification:
    name: ⏰ All Cron Routes + Webhooks Certification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate every cron route and Vercel registration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const root = path.join(process.cwd(), 'src/app/api/cron');
          const dirs = fs.readdirSync(root, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .sort();
          const registered = new Set((vercel.crons || []).map((cron) => cron.path));
          const missingRoutes = dirs.filter((name) => !fs.existsSync(path.join(root, name, 'route.ts')));
          const unregistered = dirs
            .map((name) => `/api/cron/${name}`)
            .filter((route) => !registered.has(route));
          const stale = [...registered]
            .filter((route) => route.startsWith('/api/cron/'))
            .filter((route) => !dirs.includes(route.replace('/api/cron/', '')));

          console.log(`Cron directories: ${dirs.length}`);
          console.log(`Vercel cron registrations: ${registered.size}`);
          if (missingRoutes.length || unregistered.length || stale.length) {
            console.error(JSON.stringify({ missingRoutes, unregistered, stale }, null, 2));
            process.exit(1);
          }
          console.log('✅ Every cron directory has route.ts and every cron is registered in vercel.json.');
          NODE

      - name: Security Regression Suite (Crons & Auth)
        run: npx vitest run tests/security/cron-auth.test.ts tests/security/endpoint-protection-audit.test.ts --reporter=dot --test-timeout=30000

      - name: Crons Routes Tests
        run: npx vitest run src/__tests__/crons/cron-routes.test.ts --reporter=dot --test-timeout=30000

      - name: Webhook Booking.com Tests
        run: npx vitest run src/__tests__/webhooks/booking-com-reviews.test.ts --reporter=dot --test-timeout=30000

      - name: Prisma Schema Validation
        run: npx prisma validate
