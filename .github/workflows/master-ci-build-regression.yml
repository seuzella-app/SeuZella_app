# Retired duplicate build/regression pipeline.
# Authoritative PR/main validation is `.github/workflows/master-gate.yml`.
# Kept manual-only so the comprehensive suite remains available without
# consuming Actions minutes on every push/PR.

name: Build & Regression (Legacy Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Legacy build/regression retired
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This legacy workflow is intentionally manual-only."
          echo "Use Master Gate for authoritative CI/CD validation."
