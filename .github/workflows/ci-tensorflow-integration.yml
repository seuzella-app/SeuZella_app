# Targeted TensorFlow integration certification.
# Master Gate owns main push validation; this workflow only runs when its
# TensorFlow-specific surface changes in a PR.

name: 🧠 TensorFlow Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/ai/tf-client.ts'
      - 'deploy/tensorflow-sidecar/**'
      - 'tests/tensorflow-integration.test.ts'
      - '.github/workflows/ci-tensorflow-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tensorflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 TF Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔧 Generate Prisma Client
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npx prisma generate

      - name: 🧠 Run TensorFlow Integration Tests
        run: npx vitest run tests/tensorflow-integration.test.ts --reporter=verbose
