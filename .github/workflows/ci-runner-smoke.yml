# Runner diagnostic only. It must not consume a run on every workflow edit.

name: CI Runner Smoke

on:
  schedule:
    - cron: '0 8 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runner-smoke
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: Runner Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          node --version
          npm --version
      - name: GitHub context
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"
      - name: Runner verdict
        run: echo "RUNNER_OK=true"
