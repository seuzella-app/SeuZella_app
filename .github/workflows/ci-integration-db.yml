name: CI - Suite 3: Integration DB & Redis Cache Tests

on:
  push:
    branches:
      - main
    paths:
      - 'prisma/**'
      - 'src/lib/db.ts'
      - 'src/lib/resolve-tenant-by-phone.ts'
      - 'tests/integration-db-cache.test.ts'
      - '.github/workflows/ci-integration-db.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration-db-test:
    name: Run DB Schema & Redis Cache Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Integration DB Vitest Suite
        run: npx vitest run tests/integration-db-cache.test.ts
