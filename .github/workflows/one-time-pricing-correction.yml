# One-time migration helper: applies the canonical public pricing correction, then self-removes.
name: one-time-pricing-correction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical pricing correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pricing = Path('src/lib/payments/pricing.ts')
          s = pricing.read_text()
          old = "parceiro: { pix: 247, cartao: 247, boleto: 257 },"
          new = "parceiro: { pix: 297, cartao: 297, boleto: 307 },"
          if old not in s:
              raise SystemExit(f'pricing.ts expected pattern not found: {old}')
          pricing.write_text(s.replace(old, new, 1))

          landing = Path('src/components/landing/PricingSection.tsx')
          s = landing.read_text()
          replacements = [
              ("pricePix: 247,\n    priceCartao: 247,\n    priceLabel: 'R$247',", "pricePix: 297,\n    priceCartao: 297,\n    priceLabel: 'R$297',", 1),
              ("desc: 'Plano PRO completo por R$247/mês — preço congelado por 24 meses", "desc: 'Plano PRO completo por R$297/mês — preço congelado por 24 meses", 1),
              ("idealParaPousada: '1–5 pousadas',", "idealParaPousada: 'até 12 quartos',", 1),
              ("idealParaPousada: '1–2 pousadas',", "idealParaPousada: '1–5 quartos',", 1),
              ("idealParaPousada: '3–5 pousadas',", "idealParaPousada: 'até 12 quartos',", 1),
              ("idealParaPousada: '6+ pousadas',", "idealParaPousada: 'até 20 quartos',", 1),
              ("{ text: 'Plano PRO completo — R$247/mês', included: true },", "{ text: 'Plano PRO completo — R$297/mês', included: true },", 1),
              ("{ text: 'Economia de R$150/mês vs. PRO regular', included: true },", "{ text: 'Economia de R$100/mês vs. PRO regular', included: true },", 1),
          ]
          for old, new, count in replacements:
              if old not in s:
                  raise SystemExit(f'PricingSection expected pattern not found: {old}')
              s = s.replace(old, new, count)

          marker = "        </AnimatePresence>\n\n        {/* Pousada Upsell & Faturamento Transparente */}"
          block = '''        </AnimatePresence>\n\n        {/* Pacote exclusivo para pousadas acima de 20 quartos */}\n        {isPousada && (\n          <motion.div\n            initial={{ opacity: 0, y: 20 }}\n            animate={isInView ? { opacity: 1, y: 0 } : {}}\n            transition={{ duration: 0.6, delay: 0.45 }}\n            className="max-w-4xl mx-auto mb-16 mt-4"\n          >\n            <div className="rounded-2xl border border-amber-500/25 bg-gradient-to-b from-amber-950/20 via-zinc-900/90 to-zinc-950/95 p-6 sm:p-8 shadow-2xl">\n              <div className="flex flex-wrap items-center justify-between gap-3 mb-5">\n                <div>\n                  <p className="text-amber-400 text-xs font-bold uppercase tracking-wider">PACOTE EXCLUSIVO</p>\n                  <h4 className="text-white font-extrabold text-lg sm:text-xl mt-1">Acima de 20 quartos</h4>\n                </div>\n                <span className="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/10 text-amber-300 border border-amber-500/25">MAX + adicional</span>\n              </div>\n              <p className="text-neutral-300 text-sm leading-relaxed">\n                Para pousadas com <strong className="text-white">mais de 20 quartos</strong>, o pacote passa para o <strong className="text-amber-300">MAX</strong>, mantendo todas as funções do plano, com adicional de <strong className="text-amber-300">R$47,00 por quarto</strong> acima do limite de 20 quartos.\n              </p>\n              <p className="text-neutral-500 text-xs mt-3">Exemplo: 21 quartos = MAX + R$47,00/mês; 25 quartos = MAX + R$235,00/mês.</p>\n            </div>\n          </motion.div>\n        )}\n\n        {/* Pousada Upsell & Faturamento Transparente */}'''
          if marker not in s:
              raise SystemExit('PricingSection insertion marker not found')
          s = s.replace(marker, block, 1)
          landing.write_text(s)

          partner = Path('src/app/parceiro/page.tsx')
          s = partner.read_text()
          for old, new, count in [
              ('Preço Fundador R$ 247/mês', 'Preço Fundador R$ 297/mês', 1),
              ('R$ 247/mês congelado por 24 meses', 'R$ 297/mês congelado por 24 meses', 1),
              ('R$ 247,00/mês por 24 meses', 'R$ 297,00/mês por 24 meses', 1),
          ]:
              if old in s:
                  s = s.replace(old, new, count)
          partner.write_text(s)
          PY

      - name: Validate correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          landing = Path('src/components/landing/PricingSection.tsx').read_text()
          pricing = Path('src/lib/payments/pricing.ts').read_text()
          assert "priceLabel: 'R$297'" in landing
          assert "idealParaPousada: 'até 12 quartos'" in landing
          assert "idealParaPousada: '1–5 quartos'" in landing
          assert "idealParaPousada: 'até 20 quartos'" in landing
          assert 'Acima de 20 quartos' in landing
          assert 'R$47,00 por quarto' in landing
          assert 'parceiro: { pix: 297, cartao: 297, boleto: 307 }' in pricing
          for wrong in ('1–5 pousadas', '1–2 pousadas', '3–5 pousadas', '6+ pousadas'):
              assert wrong not in landing, wrong
          print('Pricing correction validation: PASS')
          PY

      - name: Commit correction and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/PricingSection.tsx src/lib/payments/pricing.ts src/app/parceiro/page.tsx
          git commit -m "fix(pricing): align room tiers and exclusive MAX overage"
          git rm .github/workflows/one-time-pricing-correction.yml
          git commit -m "chore(ci): remove one-time pricing correction workflow"
          git push
