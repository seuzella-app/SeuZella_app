name: CI - Cérebro Zélla: Multimodal & Audio Fallback Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/voice/**'
      - 'src/lib/audio-transcriber.ts'
      - 'tests/zella-audio-fallback.test.ts'
      - '.github/workflows/ci-zella-audio-fallback.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audio-fallback-test:
    name: Run Audio Fallback & STT Degradation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Audio Fallback Vitest Suite
        run: npx vitest run tests/zella-audio-fallback.test.ts
