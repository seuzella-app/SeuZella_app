name: CI - ZCC Zélla Central Control (Command Center)

on:
  push:
    paths:
      - 'src/app/zcc/**'
      - 'src/components/zcc/**'
      - 'src/app/api/zcc/**'
      - '.github/workflows/ci-zcc-control.yml'
  pull_request:
    paths:
      - 'src/app/zcc/**'
      - 'src/components/zcc/**'
      - 'src/app/api/zcc/**'

jobs:
  validate-zcc-control:
    name: Validate ZCC Command Center Components & APIs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck ZCC Command Center Module
        run: npx tsc --noEmit

      - name: Verify Next.js Build
        run: npm run build
