# Extended harness certification.
# Master Gate is the only mandatory PR/push gate.
# This heavier build/integration lane runs weekly or on demand.

name: 🧠 V11-P0 — Harness Build & Integration

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-harness-certification
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token_for_ci
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
  CI: 'true'

jobs:
  harness-build-integration:
    name: 🏗️ Prisma + TypeCheck + DSPy/DPO + Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma Schema Integrity Check
        run: npx prisma generate && npx prisma validate

      - name: TypeScript Full TypeCheck
        run: npm run typecheck

      - name: DSPy & DPO Wire Audit
        run: |
          npx vitest run \
            tests/dspy-optimizer.test.ts \
            tests/dpo-collector.test.ts

      - name: Production Build Smoke Test
        run: npx next build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"
          NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum-length-xyz
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: production
