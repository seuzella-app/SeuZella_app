name: CI - Mobile App & PWA Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/manifest.ts'
      - 'tests/pwa-mobile-manifest.test.ts'
      - '.github/workflows/ci-pwa-mobile.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pwa-mobile-test:
    name: Run PWA & Mobile App Readiness Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute PWA Vitest Suite
        run: npx vitest run tests/pwa-mobile-manifest.test.ts
