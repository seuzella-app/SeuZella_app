# ============================================================================
# ZÉLLA — SecLists Integration Certification
# ============================================================================
# Validates the security datasets used by the application security layer.
# Master Gate remains the authoritative PR/push gate.
# This is a targeted scheduled/manual certification to avoid duplicate CI.
# ============================================================================

name: 🛡️ SecLists Integration Certification

on:
  schedule:
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seclists-certification
  cancel-in-progress: true

jobs:
  test:
    name: 🛡️ SecLists Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔄 Generate Prisma Client
        run: npx prisma generate

      - name: 🛡️ Run SecLists Certification
        run: npx vitest run tests/seclists-integration.test.ts --reporter=dot
