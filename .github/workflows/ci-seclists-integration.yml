# ============================================================================
# ZÉLLA — CI: SecLists Integration Tests
# ============================================================================
# Valida que os 5 datasets de segurança do SecLists estão presentes e íntegros.
#
# Datasets validados:
#   1. jailbreak-prompts.json (1.403 prompts de jailbreak)
#   2. sast-patterns.json (119 strings de código perigoso)
#   3. malicious-functions.json (94 funções de backdoor)
#   4. common-passwords.json (10.000 senhas mais comuns)
#   5. cmd-injection.json (200 payloads de RCE)
# ============================================================================

name: 🛡️ SecLists Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/security/seclists-loader.ts'
      - 'public/data/seclists/**'
      - 'tests/seclists-integration.test.ts'
      - '.github/workflows/ci-seclists-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/security/seclists-loader.ts'

jobs:
  test:
    name: 🛡️ SecLists Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🛡️ Run SecLists Tests
        run: npx vitest run tests/seclists-integration.test.ts --reporter=verbose
