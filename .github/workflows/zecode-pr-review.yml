# ============================================================================
# Zélla — ZéCode PR Review (CodeRabbit-style)
# ============================================================================
# Roda automaticamente quando um PR é aberto ou sincronizado:
#   1. Extrai diff do PR
#   2. Roda reviewer-service.ts (reusa 100% do código do ZCC)
#   3. Em modo mock: heurísticas apenas ($0)
#   4. Em modo live: GLM 5.2 para análise profunda
#   5. Posta comentários no PR via GitHub API
#   6. Adiciona labels: zécode:emergency / zécode:critical
#
# Para ativar modo live (GLM 5.2):
#   1. Adicione secret no repo: GLM_5_2_API_KEY
#   2. Adicione var: CEREBRO_LIVE_MODE=true
#   3. (Opcional) Adicione secret DATABASE_URL para persistir reviews
# ============================================================================

name: ZéCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  zecode-review:
    name: 🤖 ZéCode Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"

      - name: Run ZéCode PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Modo mock por default ($0). Para live, configure secrets abaixo:
          CEREBRO_LIVE_MODE: ${{ vars.CEREBRO_LIVE_MODE || 'false' }}
          GLM_5_2_API_KEY: ${{ secrets.GLM_5_2_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-5.2' }}
          # Budget guard (reusa config do Cérebro)
          CEREBRO_MONTHLY_BUDGET_USD: ${{ vars.CEREBRO_MONTHLY_BUDGET_USD || '20' }}
          # DATABASE_URL opcional — se vazio, pula persistência
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/seuzella_test' }}
        run: npx tsx scripts/zecode-pr-review.ts

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zecode-review-${{ github.event.pull_request.number }}
          path: |
            dev.log
            server.log
          retention-days: 7
          if-no-files-found: ignore
