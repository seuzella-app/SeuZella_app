# ============================================================================
# Zélla — ZéCode PR Review (CodeRabbit-style)
# ============================================================================
# Advisory engineering review. Master Gate remains the authoritative merge gate.
# Runs only when application/infra/security code changes.
#
#   1. Extracts PR diff
#   2. Runs reviewer-service.ts (reuses ZCC code)
#   3. Mock mode: deterministic heuristics ($0)
#   4. Live mode: GLM 5.2 for deeper analysis
#   5. Posts review comments/labels through GitHub API
#
# Cost/safety policy:
#   - No push workflow
#   - No full-suite duplication
#   - Cancel superseded synchronize runs
#   - Live GLM remains opt-in
# ============================================================================

name: ZéCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'scripts/**'
      - 'security-validators/**'
      - 'public/data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'vercel.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: zecode-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zecode-review:
    name: 🤖 ZéCode Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seuzella_test"

      - name: Run ZéCode PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CEREBRO_LIVE_MODE: ${{ vars.CEREBRO_LIVE_MODE || 'false' }}
          GLM_5_2_API_KEY: ${{ secrets.GLM_5_2_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-5.2' }}
          CEREBRO_MONTHLY_BUDGET_USD: ${{ vars.CEREBRO_MONTHLY_BUDGET_USD || '20' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/seuzella_test' }}
        run: npx tsx scripts/zecode-pr-review.ts

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zecode-review-${{ github.event.pull_request.number }}
          path: |
            dev.log
            server.log
          retention-days: 7
          if-no-files-found: ignore
