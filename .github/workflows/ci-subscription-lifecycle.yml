name: CI - Iceberg Block 1: Monetization & Subscription Lifecycle

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/api/checkout/**'
      - 'src/app/api/webhooks/payment/**'
      - 'tests/subscription-lifecycle-idempotency.test.ts'
      - '.github/workflows/ci-subscription-lifecycle.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  monetization-subscription-test:
    name: Run Monetization & Subscription Lifecycle Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Subscription Lifecycle Vitest Suite
        run: npx vitest run tests/subscription-lifecycle-idempotency.test.ts
