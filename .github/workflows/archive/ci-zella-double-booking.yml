name: CI - Cérebro Zélla: Double Booking Race Condition Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/cerebro/**'
      - 'tests/zella-double-booking.test.ts'
      - '.github/workflows/ci-zella-double-booking.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  double-booking-test:
    name: Run Double Booking Optimistic Locking Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Double Booking Vitest Suite
        run: npx vitest run tests/zella-double-booking.test.ts
