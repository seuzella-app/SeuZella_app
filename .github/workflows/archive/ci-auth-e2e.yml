name: CI - Enterprise Auth & E2E Checkout Cascade

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/auth/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/checkout/**'
      - 'src/app/api/webhooks/payment/**'
      - 'src/middleware.ts'
      - '.github/workflows/ci-auth-e2e.yml'
  pull_request:
    paths:
      - 'src/lib/auth/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/checkout/**'
      - 'src/app/api/webhooks/payment/**'
      - 'src/middleware.ts'

permissions:
  contents: read

jobs:
  validate-auth-and-checkout:
    name: Validate Enterprise Auth & E2E Cascade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck Auth & Checkout Code
        run: npx tsc --noEmit
