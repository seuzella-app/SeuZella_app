name: CI - Iceberg Block 4: Sustainability, Growth & Churn Control

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/metrics/**'
      - 'tests/sustainability-growth-churn.test.ts'
      - '.github/workflows/ci-sustainability-growth.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sustainability-growth-test:
    name: Run Sustainability, Growth & Churn Prevention Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Execute Sustainability & Growth Vitest Suite
        run: npx vitest run tests/sustainability-growth-churn.test.ts
