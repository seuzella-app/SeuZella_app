name: 🏗️ Production Build & Smoke Test Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.js'
      - 'package.json'
  pull_request:
    branches: [ main ]

jobs:
  production-build-gate:
    name: ⚙️ Next.js Production Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 💎 Generate Prisma Client
        run: npx prisma generate

      - name: 🏗️ Validate Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: "ci-build-test-secret-key-32-chars-long"
          NEXTAUTH_URL: "https://smart-hotel-zehla.vercel.app"
