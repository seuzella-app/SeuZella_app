name: 🛢️ Prisma Schema & Migration Integrity Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'prisma/**'
      - 'src/lib/db/**'
  pull_request:
    branches: [ main ]

jobs:
  prisma-integrity-check:
    name: 🔍 Validate Schema & Migration Drift
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 Validate Prisma Schema Syntax
        run: npx prisma validate

      - name: 📐 Check Prisma Format
        run: npx prisma format --check

      - name: 💎 Generate Prisma Client
        run: npx prisma generate
