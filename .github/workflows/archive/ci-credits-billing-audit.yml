name: 💰 Credits, Amortization & Billing Audit Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'src/lib/payments/**'
      - 'src/lib/credits/**'
      - 'tests/payments.test.ts'
      - 'tests/subscription-lifecycle-idempotency.test.ts'
      - 'tests/sustainability-growth-churn.test.ts'
  pull_request:
    branches: [ main ]

jobs:
  billing-credits-gate:
    name: 💸 Financial Auditing & Subscriptions Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 💎 Generate Prisma Client
        run: npx prisma generate

      - name: 🧪 Execute Payments & Billing Integrity Suite
        run: npx vitest run tests/payments.test.ts tests/subscription-lifecycle-idempotency.test.ts tests/sustainability-growth-churn.test.ts
        env:
          NODE_ENV: test
