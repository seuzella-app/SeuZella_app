name: 🛡️ Multi-Tenant RLS & Data Isolation Guard

on:
  push:
    branches: [ main ]
    paths:
      - 'src/lib/db/**'
      - 'prisma/**'
      - 'src/app/api/**'
      - 'tests/data-governance-lgpd.test.ts'
      - 'tests/integration-db-cache.test.ts'
  pull_request:
    branches: [ main ]

jobs:
  tenant-isolation-gate:
    name: 🔒 Verify Tenant RLS & Context Boundary
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 💎 Generate Prisma Client
        run: npx prisma generate

      - name: 🧪 Execute Multi-Tenant & RLS Test Suite
        run: npx vitest run tests/data-governance-lgpd.test.ts tests/integration-db-cache.test.ts
        env:
          NODE_ENV: test
          CEREBRO_LIVE_MODE: false
          DATABASE_URL: "file:./dev.db"
