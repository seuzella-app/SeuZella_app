# ============================================================================
# Zélla Production Stack — VPS Hostinger MVK4
# ============================================================================
# Deploy em VPS Hostinger MVK4 (4 vCPU, 16GB RAM, 200GB NVMe).
#
# Pré-requisitos:
#   1. Docker + Docker Compose instalados na VPS
#   2. Domínio seuzella.com apontando para o IP da VPS
#   3. Certbot (Let's Encrypt) para SSL
#   4. Backup automático PostgreSQL configurado
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================================

version: '3.8'

services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zehla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zehla_prod
      POSTGRES_USER: zehla_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"  # apenas local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zehla_app -d zehla_prod"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── PgBouncer — connection pooling ────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    container_name: zehla-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: zehla_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      DB_HOST: postgres
      DB_NAME: zehla_prod
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Redis — cache + rate limit + queue ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zehla-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Zélla App (Next.js) ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zehla-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://zehla_app:${POSTGRES_PASSWORD}@pgbouncer:5432/zehla_prod?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Caddy — reverse proxy + SSL automático ───────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: zehla-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-seuzella.com}
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
