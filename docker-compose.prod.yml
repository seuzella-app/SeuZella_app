version: '3.8'

networks:
  zehla-internal:
    driver: bridge
    internal: true
  zehla-edge:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: marciocau14/smarthotel-zehla:latest
    restart: always
    user: "1001:1001"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DB_USER:?DB_USER_REQUIRED}:${DB_PASS:?DB_PASS_REQUIRED}@postgres:5432/${DB_NAME:?DB_NAME_REQUIRED}?schema=public&sslmode=require"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}@redis:6379"
      ZELLA_ENCRYPTION_KEY: "${ZELLA_ENCRYPTION_KEY:?ZELLA_ENCRYPTION_KEY_REQUIRED}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET_REQUIRED}"
      META_APP_SECRET: "${META_APP_SECRET:?META_APP_SECRET_REQUIRED}"
      ZELLA_M2M_ED25519_PUBLIC_KEY: "${ZELLA_M2M_ED25519_PUBLIC_KEY:?ZELLA_M2M_ED25519_PUBLIC_KEY_REQUIRED}"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - zehla-internal
      - zehla-edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: "${DB_USER:?DB_USER_REQUIRED}"
      POSTGRES_PASSWORD: "${DB_PASS:?DB_PASS_REQUIRED}"
      POSTGRES_DB: "${DB_NAME:?DB_NAME_REQUIRED}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zehla-internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zehla-internal
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
