version: '3.8'

networks:
  zehla-internal:
    driver: bridge
    internal: true # Isolamento: Sem acesso direto da Internet externa
  zehla-edge:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: marciocau14/smarthotel-zehla:latest
    restart: always
    user: "1001:1001" # Execução em modo non-root
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}?schema=public&sslmode=prefer"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      ZELLA_ENCRYPTION_KEY: "${ZELLA_ENCRYPTION_KEY}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      META_APP_SECRET: "${META_APP_SECRET}"
      ZELLA_M2M_ED25519_PUBLIC_KEY: "${ZELLA_M2M_ED25519_PUBLIC_KEY:-}"
      ZELLA_M2M_ED25519_PRIVATE_KEY: "${ZELLA_M2M_ED25519_PRIVATE_KEY:-}"
    ports:
      - "127.0.0.1:3000:3000" # Apenas localhost para o Nginx reverso
    networks:
      - zehla-internal
      - zehla-edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-zehla}
      POSTGRES_PASSWORD: ${DB_PASS:-zehla_secure_prod_pwd}
      POSTGRES_DB: ${DB_NAME:-zehla_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zehla} -d ${DB_NAME:-zehla_production}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zehla-internal

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-zehla_redis_secure_pwd} 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy volatile-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zehla_redis_secure_pwd}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zehla-internal

volumes:
  pgdata:
  redisdata:
